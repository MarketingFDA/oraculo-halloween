<title>Oráculo do Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@1&display=swap">
<style>
/* Este artefato só leva ao Oráculo oficial, publicado no GitHub Pages. */
:root{color-scheme:dark;--ink:#06050c;--parch:#eee2c6;--mute:#a195b6;--gold:#d8a442;--gold-2:#f4d78a}
:root:not([data-theme="light"]){--ink:#06050c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#06050c}}
:root[data-theme="dark"]{--ink:#06050c}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#241540 0%,#120c24 45%,var(--ink) 100%);color:var(--parch);
  font-family:"Cormorant Garamond",Georgia,serif}
main{max-width:460px}
.moon{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;
  background:radial-gradient(42% 42% at 40% 36%,#fffbf0 0%,#f1e5c4 40%,#d6c49c 70%,#a8977a 100%);
  box-shadow:0 0 60px 14px rgba(241,229,196,.16)}
h1{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,11vw,3.8rem);line-height:1;margin:0 0 .6rem;color:var(--gold-2)}
p{font-style:italic;font-size:1.2rem;color:var(--mute);margin:0 0 1.6rem}
a.btn{display:inline-block;font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.95rem;
  color:#1c1106;text-decoration:none;padding:1rem 2rem;min-height:56px;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
  background:linear-gradient(170deg,#f8dd92 0%,#dcab49 42%,#b7812a 55%,#efc766 100%)}
a.btn:focus-visible{outline:3px solid #c9a8ff;outline-offset:3px}
small{display:block;margin-top:1.2rem;color:#776b8e;font-size:.95rem;word-break:break-all}
</style>
<main>
  <div class="moon" aria-hidden="true"></div>
  <h1>Oráculo do Halloween</h1>
  <p>A bruxa mudou de endereço. Toque abaixo para entrar no reino.</p>
  <a class="btn" id="go" href="https://marketingfda.github.io/oraculo-halloween/" target="_blank" rel="noopener">Entrar no Oráculo</a>
  <small>marketingfda.github.io/oraculo-halloween</small>
</main>
<script>
(function(){
  var url="https://marketingfda.github.io/oraculo-halloween/";
  try{window.top.location.href=url;}catch(e){
    try{window.location.href=url;}catch(e2){}
  }
})();
</script>
